exp:
  backbone: mit_b0

dataset:
  root_dir: datasets/Fruit
  num_classes: 2
  input_shape: [512, 512]
  channels: 31

train:
  split: train
  samples_per_gpu: 2
  num_epoch: 15
  eval_epoch: 5
  num_workers: 2

val:
  split: test
  batch_size: 2

optimizer:
  type: Adam
  learning_rate: 6e-5
  betas: [0.9, 0.999]
  weight_decay: 5e-4

head_optimizer:
  type: SGD
  learning_rate: 5e-4
  momentum: 0.9
  weight_decay: 5e-4

evpl_optimizer:
  type: Adam
  learning_rate: 1e-3

scheduler:
  type: CosineAnnealing
  warmup_iter: 500
  warmup_ratio: 1e-6
  power: 1.0

evpl:
  use_isp: true
