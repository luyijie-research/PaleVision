exp:
  backbone: mit_b1

dataset:
  root_dir: datasets/LIB-HSI
  num_classes: 44
  input_shape: [256, 256]
  channels: 129

train:
  split: train
  samples_per_gpu: 16
  num_epoch: 300
  eval_epoch: 2
  num_workers: 4

val:
  split: test
  batch_size: 16

optimizer:
  backbone:
    type: AdamW
    learning_rate: 6e-5
    weight_decay: 0.01
  head:
    type: AdamW
    learning_rate: 5e-4
    weight_decay: 0.01
  evpl:
    type: Adam
    learning_rate: 2e-3

scheduler:
  type: WarmupCosine
  warmup_epochs: 10

loss:
  type: focal
  focal_gamma: 2.0
  use_class_weight: true

evpl:
  use_isp: true
  lambda_init_nm: [450.0, 530.0, 580.0]
  freeze: false

augmentation:
  use_mixup: false
  mixup_alpha: 0.2

training:
  grad_clip: 5.0
